<div class="container mx-auto p-4 max-w-md">
  <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Login</h2>
  <form (ngSubmit)="login()" #loginForm="ngForm" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
    <div class="mb-4">
      <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
      <input type="email" id="email" name="email" [(ngModel)]="email" required
             class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
             placeholder="Enter your email">
    </div>
    <div class="mb-6">
      <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password:</label>
      <input type="password" id="password" name="password" [(ngModel)]="password" required
             class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline"
             placeholder="******************">
    </div>
    <div *ngIf="errorMessage" class="mb-4 text-red-500 text-sm text-center">
      {{ errorMessage }}
    </div>
    <div class="flex items-center justify-between">
      <button type="submit" [disabled]="!loginForm.form.valid"
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline disabled:bg-gray-400">
        Sign In
      </button>
      <a routerLink="/register" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
        Create an Account
      </a>
    </div>
  </form>
</div>
